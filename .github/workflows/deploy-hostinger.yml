# Builds the static site and uploads it to Hostinger whenever main changes.
#
# The upload is rsync over SSH with a dedicated deploy key (Hostinger's secure FTP resets the data
# connection, so FTP is not used). Only files whose content changed are sent.
#
# One-time setup (repository Settings, Secrets and variables, Actions):
#   Secret:     SSH_PRIVATE_KEY   the private half of the deploy key (the public half is added in hPanel, SSH Access)
#   Variables:  SSH_HOST          hPanel, SSH Access, IP
#               SSH_PORT          hPanel, SSH Access, Port (65002)
#               SSH_USER          hPanel, SSH Access, Username
#               SSH_KNOWN_HOSTS   the server's host key line, so the upload only ever talks to the real server
#               DEPLOY_PATH       where to put the site, relative to the home folder, ending in a slash.
#                                 Test folder: domains/gloriamaybyron.com/public_html/new/
#                                 Live site:   domains/gloriamaybyron.com/public_html/
# See README, "Deploying to Hostinger".
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy that has not finished, so uploads never overlap.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Refuse to run with a missing setting or a path outside this website's folder.
      - name: Check the deploy settings
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          for name in SSH_PRIVATE_KEY SSH_HOST SSH_PORT SSH_USER SSH_KNOWN_HOSTS DEPLOY_PATH; do
            [ -n "${!name}" ] || { echo "::error::Missing setting: $name (see the comment at the top of this workflow)."; exit 1; }
          done
          case "$DEPLOY_PATH" in
            domains/gloriamaybyron.com/public_html/|domains/gloriamaybyron.com/public_html/*/) ;;
            *) echo "::error::DEPLOY_PATH must be domains/gloriamaybyron.com/public_html/ or a folder inside it, ending in a slash."; exit 1 ;;
          esac
          echo "Deploying to: $DEPLOY_PATH"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: npx vitest run

      - name: Build the static site
        run: node scripts/build-static.mjs
        env:
          SITE_URL: https://gloriamaybyron.com

      - name: Check the build before uploading
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/.htaccess
          for page in about music announcements gallery awards contact; do
            test -f "dist/client/$page/index.html" || { echo "Missing page: $page"; exit 1; }
          done

      - name: Upload to Hostinger over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          TARGET="$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

          # Everything: compare by content, so unchanged files are not sent again. Nothing is deleted here.
          rsync -rlcz --omit-dir-times --chmod=D755,F644 --stats -e "$SSH" dist/client/ "$TARGET"

          # The folders this site fully owns also drop files that no longer exist (old fingerprinted bundles).
          for dir in assets images fonts og; do
            if [ -d "dist/client/$dir" ]; then
              rsync -rlcz --omit-dir-times --chmod=D755,F644 --delete -e "$SSH" "dist/client/$dir/" "$TARGET$dir/"
            fi
          done
          echo "Deployed to $DEPLOY_PATH"
